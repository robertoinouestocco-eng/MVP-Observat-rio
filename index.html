<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids Sentinel — Observatório ECA Digital (protótipo)</title>
<style>
/* PROTÓTIPO DE BAIXA FIDELIDADE: estrutura e fluxos; sem acabamento visual. Identidade do MVP mantida (preto + verde). */
:root{--bg:#000;--fg:#fff;--ne:#c8ff00;--mut:#a8a8a8;--card:#0d0d0d;--bd:#333;--warn:#f0e040;--bad:#ff7a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Segoe UI',sans-serif;line-height:1.55}
a{color:var(--ne)}:focus-visible{outline:3px solid var(--ne);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--ne);color:#000;padding:6px 10px;z-index:99}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--bd)}
.logo{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ne);text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px}nav a{border:1px solid var(--bd);border-radius:999px;padding:6px 12px;color:var(--fg);text-decoration:none;font-size:.85rem}
nav a[aria-current]{border-color:var(--ne);color:var(--ne)}
main{max-width:1000px;margin:auto;padding:22px 16px 80px}
h1{color:var(--ne);font-size:clamp(1.7rem,6vw,2.6rem);margin:.2em 0}h2{color:var(--ne);margin:1.6em 0 .4em}h3{margin:.3em 0}
.lead{font-size:1.08rem;max-width:760px}.mut{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.card{background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:14px;display:block;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--ne)}
.big{font-size:2.4rem;font-weight:800;color:var(--ne);line-height:1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input,select,textarea{background:#000;color:var(--fg);border:1px solid #666;border-radius:6px;padding:8px;font:inherit;max-width:100%}
textarea{width:100%;min-height:90px}label{display:block;margin:10px 0 3px;font-weight:600}label.i{display:inline-flex;gap:6px;margin:0;font-weight:400}
button,.btn{background:var(--ne);color:#000;border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;font:inherit;font-weight:700;text-decoration:none;display:inline-block}
button.g,.btn.g{background:none;color:var(--ne);border:1px solid var(--ne)}
.pills button{background:none;color:var(--fg);border:1px solid var(--bd);border-radius:999px;font-weight:400}.pills button[aria-pressed=true]{background:var(--ne);color:#000;font-weight:700}
.st{display:inline-block;border:1px solid var(--bd);border-radius:999px;padding:1px 9px;font-size:.78rem;white-space:nowrap}
.st.A{border-color:var(--ne);color:var(--ne)}.st.P{border-color:var(--warn);color:var(--warn)}.st.I{border-color:var(--bad);color:var(--bad)}
.os{border:1px solid var(--bd);border-radius:5px;padding:0 6px;font-size:.72rem;margin-right:3px}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:.85rem}.bar span{min-width:170px;color:var(--mut)}.bar i{display:block;height:8px;background:var(--ne);border-radius:4px}.bar div{flex:1;background:#1c1c1c;border-radius:4px}
.tbl{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--ne)}
.ph{background:repeating-linear-gradient(45deg,#111,#111 10px,#181818 10px,#181818 20px);border:1px dashed #555;border-radius:8px;height:130px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.82rem;text-align:center;padding:6px}
.tl{list-style:none;margin:10px 0;padding-left:16px;border-left:2px solid var(--bd)}.tl li{padding:0 0 12px 12px;position:relative}.tl li::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ne)}.tl li.lei::before{background:#7ad7ff}.tl li.plataforma::before{background:var(--warn)}
.note{border-left:4px solid var(--ne);background:var(--card);padding:10px 14px;margin:12px 0}.note.w{border-color:var(--warn)}
details{border:1px solid var(--bd);border-radius:8px;margin:6px 0;background:var(--card)}summary{cursor:pointer;padding:10px 14px;font-weight:700}details>div{padding:0 14px 10px}
.err{color:var(--bad);font-size:.85rem}.hp{position:absolute;left:-9999px}
.fab{position:fixed;right:14px;bottom:14px;border-radius:999px;padding:12px 18px;z-index:50}
.chat{position:fixed;right:14px;bottom:70px;width:min(360px,calc(100vw - 28px));height:min(480px,70vh);background:#0a0a0a;border:1px solid var(--ne);border-radius:12px;z-index:50;display:flex;flex-direction:column}.chat[hidden]{display:none}
.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.m{padding:7px 10px;border-radius:10px;max-width:90%;white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--ne);color:#000}.m.b{background:#181818;border:1px solid var(--bd)}
.chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}.chat input{flex:1;min-width:0}
footer{max-width:1000px;margin:0 auto;padding:16px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:10px}footer img{width:80px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

instagram":"A","roblox":"A"}},{"id":"SP-02","eixo":5,"s":"As ferramentas de supervisão dos pais são fáceis de encontrar e de usar.","d":{"instagram":"A","roblox":"A"}},{"id":"SP-03","eixo":5,"s":"Quando a supervisão dos pais está ativa, o jovem vê um aviso visível.","d":{"instagram":"N","roblox":"N"}},{"id":"SP-04","eixo":5,"s":"Os pais podem limitar e acompanhar o tempo de uso.","d":{"instagram":"A","roblox":"P"}},{"id":"SP-05","eixo":5,"s":"Para crianças e adolescentes, as configurações já começam no nível mais alto de proteção.","d":{"instagram":"P","roblox":"P"}},{"id":"SP-06","eixo":5,"s":"Os pais podem revisar o uso de inteligência artificial e desligar essas funções.","d":{"instagram":"P","roblox":"N"}},{"id":"SP-07","eixo":5,"s":"A plataforma incentiva o uso saudável, a educação digital e oferece apoio emocional.","d":{"instagram":"A","roblox":"P"}},{"id":"SP-08","eixo":5,"s":"Os pais dispõem de ferramentas para gerenciar a experiência dos filhos.","d":{"instagram":"P","roblox":"P"}},{"id":"SP-09","eixo":5,"s":"A plataforma não usa truques de design que empurrem crianças a fazer o que não querem (interfaces manipulativas).","d":{"instagram":"N","roblox":"N"}},{"id":"RS-01","eixo":6,"s":"Contas de adolescentes até 16 anos ficam vinculadas a um responsável.","d":{"instagram":"N","roblox":"C"}},{"id":"RS-02","eixo":6,"s":"A supervisão não é afrouxada quando não há responsável vinculado à conta.","d":{"instagram":"P","roblox":"N"}},{"id":"RS-03","eixo":6,"s":"Em serviços impróprios para menores, há aviso e restrição de acesso.","d":{"instagram":"X","roblox":"X"}},{"id":"RS-04","eixo":6,"s":"Se a conta de um menor for suspensa, existe um caminho rápido para recorrer.","d":{"instagram":"P","roblox":"N"}},{"id":"RS-05","eixo":6,"s":"Há regras específicas para proteger os dados pessoais de crianças.","d":{"instagram":"A","roblox":"A"}},{"id":"PD-01","eixo":7,"s":"A plataforma não usa o perfil de crianças e adolescentes para direcionar anúncios.","d":{"instagram":"A","roblox":"A"}},{"id":"PD-02","eixo":7,"s":"A plataforma não monta perfis de comportamento de crianças e adolescentes.","d":{"instagram":"A","roblox":"A"}},{"id":"PD-03","eixo":7,"s":"A plataforma não ganha dinheiro com conteúdo que sexualize crianças e adolescentes.","d":{"instagram":"P","roblox":"P"}},{"id":"PD-04","eixo":7,"s":"Os dados são tratados respeitando a privacidade, conforme a LGPD.","d":{"instagram":"P","roblox":"N"}},{"id":"JG-01","eixo":8,"s":"Jogos não podem ter caixas de recompensa (“loot boxes”) para crianças e adolescentes.","d":{"instagram":"X","roblox":"N"}},{"id":"JG-02","eixo":8,"s":"Os jogos têm proteções e limites para a interação com outras pessoas.","d":{"instagram":"X","roblox":"P"}},{"id":"MI-01","eixo":9,"s":"Imagens e sons captados por equipamentos de monitoramento infantil não podem ser violados.","d":{"instagram":"X","roblox":"X"}},{"id":"VG-01","eixo":10,"s":"A plataforma remove e comunica às autoridades casos de abuso e aliciamento.","d":{"instagram":"P","roblox":"P"}},{"id":"DN-01","eixo":11,"s":"Existe um canal público e fácil para denunciar violações.","d":{"instagram":"A","roblox":"A"}},{"id":"DN-02","eixo":11,"s":"Depois de uma denúncia, o conteúdo é retirado dentro do que a lei prevê.","d":{"instagram":"A","roblox":"P"}},{"id":"DN-03","eixo":11,"s":"Quem teve um conteúdo removido recebe explicações e pode se manifestar.","d":{"instagram":"P","roblox":"P"}},{"id":"DN-04","eixo":11,"s":"Há mecanismos para evitar o abuso do sistema de denúncias.","d":{"instagram":"N","roblox":"N"}},{"id":"TR-01","eixo":12,"s":"A plataforma publica, em português, relatórios de transparência a cada semestre.","d":{"instagram":"A","roblox":"P"}},{"id":"TR-02","eixo":12,"s":"Pesquisadores podem acessar dados gratuitamente para estudar a proteção de crianças.","d":{"instagram":"N","roblox":"N"}},{"id":"GV-01","eixo":13,"s":"A empresa tem representante legal no Brasil.","d":{"instagram":"N","roblox":"N"}}],"eca":{"intro":{"oque":"O ECA Digital (Lei nº 15.211/2025) é o conjunto de regras que protege crianças e adolescentes em aplicativos, jogos, redes sociais e sites.","quando":"Está em vigor desde 17 de março de 2026.","quem":"Vale para empresas que oferecem serviços digitais voltados a crianças e adolescentes ou que provavelmente serão acessados por eles.","fiscaliza":"A ANPD fiscaliza o cumprimento da lei.","aviso":"Esta é uma explicação didática. Ela não substitui o texto oficial da lei nem orientação jurídica."},"eixos":[{"titulo":"Proteção por padrão","resumo":"Quando uma criança ou adolescente entra numa plataforma, tudo já deve vir no modo mais seguro, sem que ninguém precise mexer em nada.","pratica":["Perfis de crianças e adolescentes começam privados.","A plataforma deve avisar com clareza quando alguém escolher uma opção menos protegida.","Há opções para evitar o uso exagerado, como pausas e lembretes.","A idade indicada do serviço precisa estar visível."],"familias":"Ao criar uma conta para o seu filho, confira se o perfil começou privado e se há lembretes de pausa.","plataformas":"Configurar o padrão no nível mais protetivo e explicar as mudanças em linguagem clara.","artigos":"arts. 7º e 8º"},{"titulo":"Gestão de riscos","resumo":"A plataforma precisa pensar nos perigos que seus recursos podem trazer e agir antes que o problema aconteça.","pratica":["Mapear riscos de recursos e sistemas, como chats e recomendações.","Prevenir situações como exploração, violência e assédio.","Ter medidas contra bullying e apoio a quem foi vítima."],"familias":"Procure na plataforma a área de segurança e veja quais cuidados ela descreve.","plataformas":"Avaliar riscos de forma contínua e documentar o que foi feito para reduzi-los.","artigos":"arts. 6º e 8º"},{"titulo":"Conteúdo adequado à idade","resumo":"Cada conteúdo deve ser indicado para a idade certa, e o que é ilegal ou impróprio não pode chegar às crianças.","pratica":["Conteúdos avaliados por faixa etária.","Barreiras contra conteúdos ilegais ou inadequados."],"familias":"Verifique a classificação indicativa e use os filtros de conteúdo disponíveis.","plataformas":"Classificar conteúdos por idade e bloquear o acesso indevido.","artigos":"art. 8º"},{"titulo":"Verificação de idade","resumo":"Para oferecer a experiência certa, a plataforma precisa saber, de forma confiável, a idade de quem usa. Só marcar “tenho 18 anos” não basta para conteúdo adulto.","pratica":["A idade é conferida ou estimada de modo proporcional.","Conteúdo só para adultos exige checagem confiável.","Os dados da checagem só podem ser usados para isso.","Lojas e sistemas do celular podem enviar o sinal de idade aos aplicativos."],"familias":"Informe a idade verdadeira do seu filho ao configurar o aparelho: isso ajuda os aplicativos a protegê-lo.","plataformas":"Adotar aferição de idade confiável e proteger os dados usados nela.","artigos":"arts. 9º, 10º, 13 e 14"},{"titulo":"Lojas e sistemas operacionais","resumo":"As lojas de aplicativos e os sistemas do celular também têm papel: ajudam a informar a idade e permitem a supervisão dos pais.","pratica":["Aferição de idade proporcional e que possa ser auditada.","Supervisão parental voluntária.","Meio seguro para informar a idade aos aplicativos.","Download de aplicativo com consentimento dos pais, quando for o caso."],"familias":"Ative o controle parental da loja de aplicativos do celular (iOS ou Android).","plataformas":"Oferecer o sinal de idade por meio seguro e respeitar a privacidade.","artigos":"arts. 12 a 14"},{"titulo":"Supervisão parental","resumo":"Pais e responsáveis devem ter ferramentas simples para acompanhar e orientar o uso, sem espionagem escondida.","pratica":["Informações claras sobre riscos e segurança.","Ferramentas de supervisão fáceis de achar.","Aviso visível quando a supervisão está ativa.","Controle do tempo de uso e revisão de funções de inteligência artificial.","Proibição de truques de design que manipulem crianças."],"familias":"Procure “supervisão parental” ou “central da família” nas configurações do aplicativo.","plataformas":"Oferecer painel de supervisão acessível e evitar interfaces manipulativas.","artigos":"arts. 16 a 18"},{"titulo":"Redes sociais","resumo":"Para adolescentes até 16 anos, a conta de rede social deve estar ligada a um responsável.","pratica":["Contas até 16 anos vinculadas ao responsável.","Suspensão de contas de menores com possibilidade de recurso rápido.","Regras específicas para dados de crianças."],"familias":"Vincule a conta do adolescente à sua e converse sobre o que ele vê e publica.","plataformas":"Vincular contas e garantir recurso rápido em caso de suspensão.","artigos":"arts. 24 e 25"},{"titulo":"Publicidade e dados","resumo":"Crianças e adolescentes não devem ser alvo de anúncios feitos com base em seu perfil, e seus dados merecem cuidado extra.","pratica":["Sem perfilamento para direcionar publicidade.","Sem perfis de comportamento de crianças e adolescentes.","Sem ganhar dinheiro com conteúdo que sexualize menores.","Tratamento de dados conforme a LGPD."],"familias":"Nas configurações de anúncios, confira se a publicidade personalizada está desligada para menores.","plataformas":"Não usar dados de crianças e adolescentes para segmentar anúncios.","artigos":"arts. 22, 23 e 26"},{"titulo":"Jogos eletrônicos","resumo":"Jogos para crianças não podem ter “caixas de recompensa” e devem ter proteções na interação com outras pessoas.","pratica":["Proibição de caixas de recompensa (loot boxes).","Limites e salvaguardas na conversa e interação entre jogadores."],"familias":"Converse sobre compras dentro do jogo e ajuste quem pode falar com seu filho.","plataformas":"Retirar caixas de recompensa para menores e configurar interações seguras.","artigos":"arts. 20 e 21"},{"titulo":"Monitoramento infantil","resumo":"Imagens e sons captados por equipamentos de monitoramento infantil, como babás eletrônicas, devem ser protegidos.","pratica":["Inviolabilidade das imagens e sons captados."],"familias":"Use senhas fortes e mantenha o equipamento atualizado.","plataformas":"Garantir a segurança e a confidencialidade dessas imagens e sons.","artigos":"art. 19"},{"titulo":"Violações graves","resumo":"Casos de abuso e aliciamento de crianças e adolescentes precisam ser removidos e comunicados às autoridades.","pratica":["Remoção rápida de conteúdo de abuso e aliciamento.","Comunicação às autoridades competentes."],"familias":"Em caso de perigo imediato, ligue 190. Denúncias de violações de direitos: Disque 100.","plataformas":"Remover o conteúdo e comunicar às autoridades dentro dos prazos da lei.","artigos":"art. 27"},{"titulo":"Denúncias e remoção","resumo":"Todo mundo deve poder denunciar uma violação com facilidade, e quem denuncia ou teve conteúdo removido precisa de respostas claras.","pratica":["Canal público e fácil para denunciar.","Retirada de conteúdo após a notificação.","Explicações e direito de resposta para quem teve conteúdo removido.","Mecanismos contra o abuso do sistema de denúncias."],"familias":"Use o botão “denunciar” da própria plataforma e guarde prints da denúncia.","plataformas":"Manter canal de denúncia visível e retornar ao usuário com clareza.","artigos":"arts. 28 a 30, 32 e 33"},{"titulo":"Transparência","resumo":"A cada semestre, as plataformas devem publicar, em português, um relatório contando o que fazem para proteger crianças e adolescentes.","pratica":["Relatórios semestrais em português.","Acesso gratuito de pesquisadores a dados, para estudar a proteção de crianças."],"familias":"Leia o resumo do relatório da plataforma que seu filho usa. O Kids Sentinel facilita essa leitura.","plataformas":"Publicar relatórios dentro dos prazos definidos pela ANPD.","artigos":"art. 31"},{"titulo":"Governança","resumo":"Empresas estrangeiras precisam ter uma pessoa ou empresa responsável no Brasil, para que a lei possa ser cumprida de verdade.","pratica":["Representante legal no País."],"familias":"Se precisar falar com a empresa, procure o canal oficial para o Brasil.","plataformas":"Indicar representante legal no Brasil.","artigos":"art. 40"}],"glossario":[["ANPD","Agência Nacional de Proteção de Dados. É o órgão que fiscaliza o ECA Digital."],["Aferição de idade","Conferir ou estimar a idade de quem usa o serviço, para oferecer a experiência adequada."],["Perfilamento","Usar os dados de uma pessoa para montar um “perfil” e, por exemplo, mostrar anúncios sob medida."],["Caixa de recompensa (loot box)","Item de jogo que se paga para abrir sem saber o que vem dentro, como um “sorteio”."],["Supervisão parental","Ferramentas para pais e responsáveis acompanharem e orientarem o uso."],["Interface manipulativa","Truque de design que empurra a pessoa a clicar ou ficar mais tempo sem perceber."],["Moderação","Trabalho de analisar e retirar conteúdos que quebram as regras da plataforma."],["LGPD","Lei Geral de Proteção de Dados, que protege os dados pessoais."],["Relatório de transparência","Documento em que a plataforma conta o que faz para cumprir a lei."],["Provedor","A empresa que oferece o aplicativo, site ou jogo."]]},"noticias":[{"data":"2026-09-16","tipo":"ANPD","plataformas":["discord"],"titulo":"ANPD mantém a suspensão das lives do Discord após recurso","texto":"A plataforma recorreu da medida cautelar, mas a ANPD manteve a suspensão e reiterou que a reversão depende de o Discord demonstrar salvaguardas capazes de mitigar os riscos identificados. O mérito dos demais itens do recurso segue em análise na Superintendência de Fiscalização, e o processo de fiscalização continua em andamento.","fonte":"Gov.br / ANPD","url":"https://www.gov.br/anpd/pt-br/assuntos/noticias/eca-digital-completa-um-ano-e-e-marco-na-protecao-de-criancas-e-adolescentes-na-internet"},{"data":"2026-08-25","tipo":"ANPD","plataformas":["tiktok"],"titulo":"ANPD multa TikTok em R$ 153,7 milhões e aprova plano de conformidade","texto":"Multa à ByteDance por cinco infrações no tratamento de dados de crianças e adolescentes, com determinação de eliminar os dados coletados irregularmente. Em decisão publicada no mesmo dia, o Conselho Diretor aprovou, em recurso, o plano de conformidade da empresa, ressalvando que ela deve cumprir a aferição de idade exigida pelo ECA Digital, conforme o cronograma definido.","fonte":"Gov.br / ANPD","url":"https://www.gov.br/anpd/pt-br/assuntos/noticias/anpd-multa-tiktok-em-r-153-7-milhoes-por-falhas-na-protecao-de-dados-de-criancas-e-adolescentes"},{"data":"2026-08-21","tipo":"ANPD","plataformas":["instagram","tiktok","discord","youtube"],"titulo":"ANPD inicia monitoramento de plataformas, lojas de aplicativos e IA generativa","texto":"Foram notificados 22 serviços, que devem responder em até dez dias úteis sobre governança, gestão de riscos, moderação e canais de denúncia. Entre as plataformas do primeiro grupo estão Instagram, Facebook, TikTok, Discord e YouTube. O monitoramento verifica o Marco Civil da Internet e as obrigações convergentes do ECA Digital.","fonte":"Gov.br / ANPD","url":"https://www.gov.br/anpd/pt-br/assuntos/noticias/anpd-avalia-como-plataformas-digitais-atuam-para-prevenir-conteudos-criminosos-e-proteger-criancas-e-mulheres-na-internet"},{"data":"2026-08-12","tipo":"ANPD","plataformas":["discord"],"titulo":"ANPD determina que o Discord suspenda transmissões ao vivo no Brasil","texto":"Medida preventiva para suspender, em três dias úteis, a funcionalidade \"Go Live\" e recursos equivalentes de transmissão e compartilhamento de vídeo. A ANPD apontou uso recorrente das lives para violência, assédio e indução à automutilação e ao suicídio, e mudanças feitas pelo Discord em março que tornaram a função menos protetiva. A reativação depende de autorização prévia e expressa da Agência.","fonte":"Gov.br / ANPD","url":"https://www.gov.br/anpd/pt-br/assuntos/noticias/em-medida-preventiva-anpd-determina-que-discord-suspenda-transmissoes-ao-vivo-no-brasil"},{"data":"2026-08-07","tipo":"ANPD","plataformas":["discord"],"titulo":"ANPD instaura processo de fiscalização contra o Discord","texto":"Processo para apurar falhas na prevenção e mitigação de riscos de contato de menores de 18 anos com conteúdos de incitação à automutilação e ao suicídio, ausência de mecanismos efetivos de aferição de idade e falhas nos deveres de remoção de conteúdo violador e de comunicação às autoridades.","fonte":"Gov.br / ANPD","url":"https://www.gov.br/anpd/pt-br/assuntos/noticias/anpd-instaura-processo-de-fiscalizacao-contra-o-discord-para-apurar-falhas-na-protecao-de-criancas-e-adolescentes"},{"data":"2026-03-17","tipo":"Notícia","plataformas":[],"titulo":"ECA Digital entra em vigor e amplia a proteção de crianças e adolescentes na internet","texto":"O Tribunal de Justiça do Rio de Janeiro divulgou a entrada em vigor da lei em seu Portal do Conhecimento.","fonte":"TJRJ","url":"https://www.tjrj.jus.br/web/portal-conhecimento/noticias/noticia/-/visualizar-conteudo/5736540/405705378"}],"linha":[{"data":"2025-09-17","tipo":"lei","plataformas":[],"titulo":"Lei nº 15.211/2025 é sancionada","texto":"Nasce o ECA Digital, com regras para proteger crianças e adolescentes em serviços digitais.","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/L15211.htm"},{"data":"2026-03-17","tipo":"lei","plataformas":[],"titulo":"ECA Digital entra em vigor","texto":"A partir desta data, as plataformas passam a ter de cumprir as regras da lei."},{"data":"2026-03","aprox":true,"tipo":"plataforma","plataformas":["discord"],"titulo":"Discord muda a função de transmissão ao vivo (Go Live)","texto":"Segundo a ANPD, a mudança feita em março deixou a função menos protetiva. A ANPD acompanhou o caso.","url":"https://www.gov.br/anpd/pt-br/assuntos/noticias/em-medida-preventiva-anpd-determina-que-discord-suspenda-transmissoes-ao-vivo-no-brasil"},{"data":"2026-08-07","tipo":"anpd","plataformas":["discord"],"titulo":"ANPD abre processo de fiscalização sobre o Discord","texto":"O processo apura a proteção contra conteúdos de automutilação, a aferição de idade e os deveres de rem lvaguardas adequadas.","url":"https://www.gov.br/anpd/pt-br/assuntos/noticias/eca-digital-completa-um-ano-e-e-marco-na-protecao-de-criancas-e-adolescentes-na-internet"},{"data":"2026-09-17","tipo":"lei","plataformas":[],"titulo":"Prazo do 1º relatório de transparência (1º semestre de 2026)","texto":"Data-limite fixada pela ANPD para as plataformas publicarem o primeiro relatório semestral."},{"data":"2026-09-17","tipo":"plataforma","plataformas":["instagram"],"titulo":"Meta publica o relatório de transparência do ECA Digital","texto":"Cobre Facebook, Instagram, Messenger e Threads. Há também relatório separado do WhatsApp.","url":"https://transparency.meta.com/reports/regulatory-transparency-reports/"},{"data":"2027-02-01","tipo":"lei","plataformas":[],"titulo":"Prazo do 2º relatório de transparência (julho a dezembro de 2026)","texto":"Próxima data-limite para as plataformas.","futuro":true}],"relatorios":[{"plataforma":"instagram","titulo":"Brazil ECA Digital Transparency Report (Facebook, Instagram, Messenger e Threads); há também relatório separado do WhatsApp","periodo":"1º semestre de 2026","publicado":"2026-09-17","localizado":true,"url":"https://transparency.meta.com/reports/regulatory-transparency-reports/","site":"Central de Transparência da Meta","avaliado":true},{"plataforma":"roblox","titulo":"Relatório ECA Digital Brasil – 1º semestre de 2026 (PDF)","periodo":"1º semestre de 2026","publicado":"","localizado":true,"url":"https://about.roblox.com/pdf/2026-h1-brazil-eca-report","site":"about.roblox.com/transparency","avaliado":true},{"plataforma":"discord","titulo":"ECA Digital Transparency Report","periodo":"1º semestre de 2026","publicado":"","localizado":true,"url":"https://discord.com/safety-transparency","site":"Transparency Hub do Discord","avaliado":false},{"plataforma":"tiktok","titulo":"Relatório de Transparência do ECA Digital","periodo":"01/01/2026 a 30/06/2026","publicado":"","localizado":false,"url":"","site":"Centro de Transparência do TikTo ":"Reportagens e relatórios com testes e documentos públicos","notas":"não","canal":"—","eca":"não","escopo":"Grandes empresas de tecnologia (EUA)","aprende":"Uso de testes diretos como evidência, no estilo dos prints do Kids Sentinel."}],"atualizacoes":[{"data":"2026-10-03","titulo":"Nova versão do Kids Sentinel","texto":"Páginas por plataforma, ranking com notas de 1 a 10, ECA Digital traduzido, linha do tempo, Radar de denúncias e assistente de dúvidas."},{"data":"2026-09-30","titulo":"Relatórios do 1º semestre de 2026","texto":"Consulta aos sites oficiais das plataformas e registro dos relatórios de transparência localizados."}]}</script>
<script>
/* Protótipo: tudo em um arquivo. Dados em #dados (JSON). Bot de IA: POST CHAT_URL (veja server/proxy.mjs); sem ele, responde com a base local. */
const D = JSON.parse(document.getElementById("dados").textContent);
const CHAT_URL = (window.CHAT_URL !== undefined) ? window.CHAT_URL : "/api/chat";
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const data = (d) => d ? d.split("-").reverse().join("/") : "";
const P = (id) => D.plataformas.find((p) => p.id === id);
const sit = (r, pid) => r.d[pid] || "N";
const tem = (p) => !!p.avaliada;
const idx = (pid, e) => { if (!tem(P(pid))) return null; const rs = D.requisitos.filter((r) => (e == null || e < 0 || r.eixo === e) && sit(r, pid) !== "X"); return rs.length ? rs.reduce((s, r) => s + ({ A: 1, P: .5 }[sit(r, pid)] || 0), 0) / rs.length : null; };
const nota = (i) => i == null ? null : 1 + 9 * i;            // nota de 1 a 10
const fn = (n) => n == null ? "—" : n.toFixed(1).replace(".", ",");
const chip = (c) => `<span class="st ${c}" title="${esc(D.status[c].ajuda)}">${D.status[c].icone} ${esc(D.status[c].rotulo)}</span>`;
const os = (a) => a.map((o) => `<span class="os">${o}</span>`).join("");
const pills = (el, vals, set, cb) => { el.innerHTML = vals.map((v) => `<button type="button" aria-pressed="${set.has(v)}">${esc(v)}</button>`).join(""); $$("button", el).forEach((b, i) => b.onclick = () => { set.has(vals[i]) ? set.delete(vals[i]) : set.add(vals[i]); cb(); pills(el, vals, set, cb); }); };
const R = [];   // rotas
const rota = (re, fn) => R.push([re, fn]);

/* ---------- Início ---------- */
rota(/^\/$/, () => ({ t: "Início", h: `<p class="mut">OBSERVATÓRIO DE CONFORMIDADE · ${esc(D.meta.lei)}</p><h1>Kids Sentinel</h1>
<p class="lead">Acompanha se plataformas digitais cumprem o ECA Digital, a lei que protege crianças e adolescentes na internet. Linguagem simples, para todos os públicos.</p>
<div class="grid">
<a class="card" href="#/plataformas"><b>Plataformas</b><br>Uma página por plataforma, com busca e filtros.</a>
<a class="card" href="#/ranking"><b>Ranking</b><br>Notas de 1 a 10 por tema de conformidade.</a>
<a class="card" href="#/eca"><b>ECA Digital traduzido</b><br>A lei sem “juridiquês”.</a>
<a class="card" href="#/radar"><b>Radar</b><br>Denúncias e sugestões do público; contato das plataformas.</a>
<a class="card" href="#/relatorios"><b>Relatórios</b><br>Relatórios de transparência das plataformas.</a>
<a class="card" href="#/observatorios"><b>Outros observatórios</b><br>Comparar iniciativas que já existem.</a></div>
<h2>Como ler os resultados</h2><p class="mut">Usamos palavras tranquilas: conformidade, ponto de ajuste, sem informação. “Sem informação” não significa descumprimento.</p>
<div class="row">${Object.keys(D.status).map(chip).join(" ")}</div>
<h2>Sobre o observatório</h2><p class="lead">O Kids Sentinel transforma obrigações legais em informação comparável: reúne o que cada plataforma declara fazer para proteger crianças e adolescentes, confronta com os requisitos da lei e mostra o resultado de forma clara. Estudos do Laboratório de Inovação da Faculdade de Direito de São Bernardo do Campo.</p>
<p class="mut">Atualização mensal: ${data(D.meta.atualizadoEm)} (ciclo ${esc(D.meta.ciclo)}). Últimas: ${D.atualizacoes.map((a) => esc(a.titulo)).join(" · ")}</p>` }));

/* ---------- Plataformas: lista com busca e filtros ---------- */
rota(/^\/plataformas$/, () => ({ t: "Plataformas", h: `<h1>Plataformas</h1>
<div class="card"><div class="row"><label class="sr" for="q">Buscar</label><input id="q" type="search" placeholder="Buscar plataforma" style="flex:1">
<label class="i" for="av">Situação</label><select id="av"><option value="">Todas</option><option value="s">Com análise</option><option value="n">Em avaliação</option></select></div>
<div class="row"><b>Categoria</b><span class="pills" id="fc"></span></div><div class="row"><b>Aparelho</b><span class="pills" id="fo"></span></div></div>
<p class="mut" id="cnt" aria-live="polite"></p><div class="grid" id="lista"></div>`, a() {
  const C = new Set(), O = new Set();
  const draw = () => {
    const q = norm($("#q").value), av = $("#av").value;
    const r = D.plataformas.filter((p) => (!C.size || C.has(p.categoria)) && (!O.size || p.so.some((o) => O.has(o))) && (!av || (av === "s") === tem(p)) && (!q || norm(p.nome + p.empresa + p.categoria).includes(q)));
    $("#cnt").textContent = r.length + " plataforma(s)";
    $("#lista").innerHTML = r.length ? r.map((p) => { const n = nota(idx(p.id)); return `<a class="card" href="#/plataforma/${p.id}"><span class="mut">${esc(p.categoria)}</span><h3>${esc(p.nome)}</h3>${os(p.so)}<br>${n == null ? '<span class="st">em avaliação</span>' : `<span class="big">${fn(n)}</span><span class="mut"> /10</span>`}</a>`; }).join("") : '<p class="note">Nenhuma plataforma com esses filtros.</p>';
  };
  pills($("#fc"), [...new Set(D.plataformas.map((p) => p.categoria))], C, draw); pills($("#fo"), ["iOS", "Android", "Web"], O, draw);
  $("#q").oninput = $("#av").onchange = draw; draw();
} }));

/* ---------- Página de uma plataforma ---------- */
rota(/^\/plataforma\/([\w-]+)$/, (m) => {
  const p = P(m[1]); if (!p) return { t: "Plataforma", h: "<h1>Plataforma não encontrada</h1><a href='#/plataformas'>Voltar</a>" };
  const i = idx(p.id), n = nota(i);
  const L = D.linha.filter((e) => !e.plataformas.length || e.plataformas.includes(p.id)).sort((a, b) => a.data.localeCompare(b.data));
  const nn = D.noticias.filter((x) => x.plataformas.includes(p.id));
  return { t: p.nome, h: `<p class="mut"><a href="#/plataformas">Plataformas</a> › ${esc(p.nome)}</p><h1>${esc(p.nome)}</h1><p class="lead">${esc(p.desc)}</p>
<div class="row"><span class="st">${esc(p.categoria)}</span> Disponível em: ${os(p.so)} <span class="mut">Empresa: ${esc(p.empresa)}</span></div>
<h2>Resumo da conformidade</h2>
${n == null ? `<p class="note">Em avaliação: ainda sem nota. Isso não indica descumprimento. Se você representa a plataforma, <a href="#/radar?aba=plataforma&p=${p.id}">envie informações</a>.</p>` : `<div class="grid"><div class="card"><span class="mut">Nota geral</span><div class="big">${fn(n)}<small class="mut"> /10</small></div></div></div>
${D.eixos.map((e, k) => { const v = nota(idx(p.id, k)); return `<div class="bar"><span>${esc(e)}</span>${v == null ? '<em class="mut">n/a</em>' : `<div><i style="width:${(v - 1) / 9 * 100}%"></i></div><b>${fn(v)}</b>`}</div>`; }).join("")}`}
<h2>Requisitos</h2><div class="row"><label class="i" for="rs">Situação</label><select id="rs"><option value="">Todas</option>${Object.keys(D.status).map((c) => `<option value="${c}">${esc(D.status[c].rotulo)}</option>`).join("")}</select></div><div id="req"></div>
<h2>Evidências (prints dos pontos de ajuste)</h2><p class="mut">Capturas de tela com data, aparelho (iOS/Android/Web) e requisito.</p>
<div class="grid"><div class="ph">PRINT 1 · iOS<br>(imagem da tela da plataforma)</div><div class="ph">PRINT 2 · Android<br>(imagem da tela da plataforma)</div></div>
<h2>Linha do tempo</h2><p class="mut">Legislação do ECA Digital e mudanças feitas pela plataforma.</p>
<ol class="tl">${L.map((e) => `<li class="${e.tipo}"><span class="mut">${data(e.data)}${e.futuro ? " · próximo prazo" : ""} · ${e.tipo === "lei" ? "Lei" : e.tipo === "anpd" ? "ANPD" : "Plataforma"}</span><br><b>${esc(e.titulo)}</b><br>${esc(e.texto)}</li>`).join("")}</ol>
${nn.length ? `<h2>Decisões e notícias</h2>${nn.map((x) => `<p><b>${esc(x.titulo)}</b> <span class="mut">${data(x.data)} · ${esc(x.tipo)}</span></p>`).join("")}` : ""}
<h2>Contato</h2><div class="grid"><a class="card" href="#/radar?aba=plataforma&p=${p.id}"><b>Sou da plataforma</b><br>Informar ajuste ou pedir revisão.</a><a class="card" href="#/radar?p=${p.id}"><b>Enviar observação ou print</b><br>Para o público.</a></div>`,

});

/* ---------- Ranking ---------- */
rota(/^\/ranking$/, () => ({ t: "Ranking", h: `<h1>Ranking de conformidade</h1><p class="lead">Notas de 1 a 10 (1 + 9 × índice de adequação). Só plataformas com análise entram.</p>
<div class="row"><label class="i" for="rt">Tema</label><select id="rt"><option value="-1">Geral</option>${D.eixos.map((e, i) => `<option value="${i}">${esc(e)}</option>`).join("")}</select></div><div class="grid" id="rk"></div><div id="sn"></div>
<h2>Por tema</h2><div class="tbl"><table id="mx"></table></div>`, a() {
  const d = () => { const t = +$("#rt").value, v = D.plataformas.filter(tem).map((p) => ({ p, v: nota(idx(p.id, t)) })).filter((x) => x.v != null).sort((a, b) => b.v - a.v);
    $("#rk").innerHTML = v.map((x, k) => `<a class="card" href="#/plataforma/${x.p.id}"><span class="mut">#${k + 1} · ${esc(x.p.categoria)}</span><h3>${esc(x.p.nome)}</h3><span class="big">${fn(x.v)}</span><span class="mut"> /10</span></a>`).join("") || '<p class="note">Sem dados neste tema.</p>';
    $("#sn").innerHTML = `<p class="mut">Aguardando análise (sem nota, o que não significa descumprimento): ${D.plataformas.filter((p) => !tem(p)).map((p) => esc(p.nome)).join(", ")}.</p>`; };
  $("#rt").onchange = d; d();
  const av = D.plataformas.filter(tem);
  $("#mx").innerHTML = `<tr><th>Tema</th>${av.map((p) => `<th>${esc(p.nome)}</th>`).join("")}</tr>` + D.eixos.map((e, i) => `<tr><td>${esc(e)}</td>${av.map((p) => `<td>${fn(nota(idx(p.id, i)))}</td>`).join("")}</tr>`).join("");
} }));

/* ---------- ECA traduzido ---------- */
rota(/^\/eca$/, () => ({ t: "ECA Digital traduzido", h: `<h1>ECA Digital traduzido</h1><p class="lead">${esc(D.eca.intro.oque)} ${esc(D.eca.intro.quando)} ${esc(D.eca.intro.fiscaliza)}</p>
<p class="note w">${esc(D.eca.intro.aviso)} <a href="${esc(D.meta.leiUrl)}" target="_blank" rel="noopener">Texto oficial ↗</a></p>
<div class="row"><label class="sr" for="eq">Buscar</label><input id="eq" type="search" placeholder="Buscar (ex.: idade, anúncios)" style="flex:1"></div><div id="el"></div>
<h2>Decisões atualizadas</h2><p><a class="btn g" href="#/noticias">Ver decisões da ANPD, do Judiciário e notícias</a></p>
<h2>Glossário</h2><dl>${D.eca.glossario.map(([t, x]) => `<dt><b>${esc(t)}</b></dt><dd>${esc(x)}</dd>`).join("")}</dl>`, a() {
  const d = () => { const q = norm($("#eq").value); $("#el").innerHTML = D.eca.eixos.filter((e) => !q || norm(JSON.stringify(e)).includes(q)).map((e) => `<details ${q ? "open" : ""}><summary>${esc(e.titulo)} <span class="mut">${esc(e.artigos)}</span></summary><div><p>${esc(e.resumo)}</p><ul>${e.pratica.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><p><b>Famílias:</b> ${esc(e.familias)}</p><p><b>Plataformas:</b> ${esc(e.plataformas)}</p></div></details>`).join("") || '<p class="note">Nada encontrado.</p>'; };
  $("#eq").oninput = d; d(); } }));

/* ---------- Notícias e decisões ---------- */
rota(/^\/noticias$/, () => ({ t: "Notícias", h: `<h1>Decisões e notícias</h1><p class="mut">ANPD, Judiciário e notícias sobre o ECA Digital.</p>
<div class="row"><span class="pills" id="nt"></span><label class="i" for="np">Plataforma</label><select id="np"><option value="">Todas</option>${D.plataformas.map((p) => `<option value="${p.id}">${esc(p.nome)}</option>`).join("")}</select></div><div id="nl"></div>`, a() {
  const T = new Set(), d = () => { const p = $("#np").value, r = D.noticias.filter((n) => (!T.size || T.has(n.tipo)) && (!p || n.plataformas.includes(p)));
    $("#nl").innerHTML = r.map((n) => `<p><span class="st">${esc(n.tipo)}</span> <span class="mut">${data(n.data)}</span><br><b>${esc(n.titulo)}</b><br>${esc(n.texto)} <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.fonte)} ↗</a></p>`).join("") || '<p class="note">Nada encontrado. Ainda não há decisões do Judiciário registradas.</p>'; };
  pills($("#nt"), ["ANPD", "Judiciário", "Notícia"], T, d); $("#np").onchange = d; d(); } }));

/* ---------- Relatórios ---------- */
rota(/^\/relatorios$/, () => ({ t: "Relatórios", h: `<h1>Relatórios</h1><p class="lead">Relatórios semestrais de transparência (art. 31). Data-limite do 1º relatório: <b>17/09/2026</b>; do 2º: 01/02/2027.</p>
<div class="tbl"><table><tr><th>Plataforma</th><th>Documento</th><th>Período</th><th>Situação</th><th>Link</th></tr>${D.relatorios.map((r) => `<tr><td>${esc(P(r.plataforma).nome)}</td><td>${esc(r.titulo)}</td><td>${esc(r.periodo)}</td><td>${r.localizado ? "Publicado" : "Não localizado"}</td><td>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Site oficial ↗</a>` : "a localizar"}</td></tr>`).join("")}</table></div>
<p class="mut">“Não localizado” significa que a página oficial não foi encontrada nesta consulta, não que o relatório não exista. Boletim mensal do observatório: <i>(a desenhar)</i>.</p>` }));

/* ---------- Observatórios ---------- */
rota(/^\/observatorios$/, () => ({ t: "Observatórios", h: `<h1>Comparar observatórios</h1><p class="note w">Resumos feitos a partir de informações públicas gerais; confirme nos sites oficiais. “—” = não verificado.</p>
<div class="tbl"><table><tr><th>Critério</th>${D.observatorios.map((o) => `<th>${esc(o.nome)}</th>`).join("")}</tr>${[["País", "pais"], ["Foco", "foco"], ["Como avalia", "metodo"], ["Dá notas?", "notas"], ["Canal de denúncia?", "canal"], ["Cobre o ECA Digital?", "eca"]].map(([n, k]) => `<tr><td><b>${n}</b></td>${D.observatorios.map((o) => `<td>${esc(o[k])}</td>`).join("")}</tr>`).join("")}</table></div>` }));

/* ---------- Radar (ouvidoria) + contato das plataformas ---------- */
const opts = (sel) => `<option value="">Selecione</option>${D.plataformas.map((p) => `<option value="${p.id}" ${sel === p.id ? "selected" : ""}>${esc(p.nome)}</option>`).join("")}`;
rota(/^\/radar$/, (m, q) => ({ t: "Radar", h: `<h1>Radar: canal aberto</h1><p class="lead">Conte o que viu numa plataforma, envie um print ou sugira melhorias. Usamos as contribuições para melhorar o observatório.</p>
<p class="note w">Perigo agora? Ligue 190. Violação de direitos de crianças: Disque 100. Este canal não substitui esses serviços.</p>
<div class="pills row"><button type="button" id="ta" aria-pressed="${q.aba !== "plataforma"}">Sou do público</button><button type="button" id="tb" aria-pressed="${q.aba === "plataforma"}">Sou de uma plataforma</button></div><div id="fm"></div>`, a() {
  const campos = (publico) => publico ? `<form id="f" novalidate><label for="fp">Plataforma</label><select id="fp">${opts(q.p)}</select>
<label for="fs">Aparelho</label><select id="fs"><option>Não sei</option><option>iOS</option><option>Android</option><option>Web</option></select>
<label for="fd">O que aconteceu? (mínimo 20 letras)</label><textarea id="fd"></textarea><label for="fi">Print (opcional)</label><input id="fi" type="file" accept="image/*">
<div class="hp"><label for="fh">Não preencha</label><input id="fh" tabindex="-1"></div><label class="i"><input type="checkbox" id="fk"> Concordo com o uso deste relato para melhorar o observatório (LGPD).</label><p><button>Enviar ao Radar</button></p></form>`
  : `<form id="f" novalidate><label for="fp">Plataforma</label><select id="fp">${opts(q.p)}</select><label for="ft">Motivo</label><select id="ft"><option>Informar um ajuste feito</option><option>Pedir revisão de avaliação</option><option>Enviar documento</option></select>
<label for="fn">Nome</label><input id="fn"><label for="fe">E-mail corporativo</label><input id="fe" type="email"><label for="fd">Mensagem (mínimo 20 letras)</label><textarea id="fd"></textarea><label class="i"><input type="checkbox" id="fk"> Concordo com o armazenamento destas informações (LGPD).</label><p><button>Enviar contato</button></p></form>`;
  const mostrar = (publico) => { $("#ta").setAttribute("aria-pressed", publico); $("#tb").setAttribute("aria-pressed", !publico); $("#fm").innerHTML = campos(publico);
    $("#f").onsubmit = (e) => { e.preventDefault(); $$(".err").forEach((x) => x.remove());
      const ruim = []; const f = (id, msg) => { const el = $("#" + id); el.setAttribute("aria-invalid", "true"); el.insertAdjacentHTML("afterend", `<div class="err" role="alert">${msg}</div>`); ruim.push(el); };
      if (!$("#fp").value) f("fp", "Escolha a plataforma."); if ($("#fd").value.trim().length < 20) f("fd", "Escreva pelo menos 20 letras.");
      if (!publico && !/^\S+@\S+\.\S+$/.test($("#fe").value)) f("fe", "Informe um e-mail válido."); if (!$("#fk").checked) f("fk", "Marque a caixa para continuar.");
      if (ruim.length) { ruim[0].focus(); return; }
      if ($("#fh")?.value) return;
      const fila = JSON.parse(localStorage.getItem("ks_radar") || "[]"), prot = "KS-" + Date.now().toString(36).toUpperCase();   // protótipo: guarda só no navegador
      fila.push({ prot, publico, plataforma: $("#fp").value, texto: $("#fd").value }); try { localStorage.setItem("ks_radar", JSON.stringify(fila)); } catch (x) {}
      $("#fm").innerHTML = `<div class="note" role="status"><b>Recebido!</b> Protocolo <b id="prot">${prot}</b>. (Protótipo: salvo só neste navegador.)</div>`; }; };
  $("#ta").onclick = () => mostrar(true); $("#tb").onclick = () => mostrar(false); mostrar(q.aba !== "plataforma");
} }));

/* ---------- Roteador ---------- */
function ir() {
  const raw = location.hash.slice(1) || "/", [path, qs] = raw.split("?"), q = Object.fromEntries(new URLSearchParams(qs || ""));
  const hit = R.find(([re]) => re.test(path)), v = $("#view");
  const res = hit ? hit[1](path.match(hit[0]), q) : { t: "Não encontrada", h: "<h1>Página não encontrada</h1><a href='#/'>Voltar ao início</a>" };
  v.innerHTML = res.h; v.dataset.rota = raw; document.title = res.t + " — Kids Sentinel"; res.a && res.a();
  $$("nav a").forEach((a) => a.getAttribute("href").split("/")[1] === path.split("/")[1] || (a.getAttribute("href") === "#/plataformas" && path.startsWith("/plataforma")) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  if (ir.n++) { const h1 = $("h1", v); if (h1) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); } scrollTo(0, 0); }   // 1ª carga: mantém o foco no “Pular para o conteúdo”
}
ir.n = 0; addEventListener("hashchange", ir); ir();

/* ---------- Assistente (IA) ---------- */
const add = (c, t) => { const d = document.createElement("div"); d.className = "m " + c; d.textContent = t; $("#msgs").appendChild(d); $("#msgs").scrollTop = 1e9; return d; };
const hist = [];
function local(q) {   // sem IA: acha o tema mais parecido na lei traduzida
  const w = norm(q).split(/\W+/).filter((x) => x.length > 3);
  const e = D.eca.eixos.map((x) => ({ x, s: w.reduce((a, k) => a + (norm(JSON.stringify(x)).includes(k) ? 1 : 0), 0) })).sort((a, b) => b.s - a.s)[0];
  return (e && e.s ? `${e.x.titulo} (${e.x.artigos}): ${e.x.resumo}` : `${D.eca.intro.oque} ${D.eca.intro.quando}`) + "\n(Modo offline: resposta sem IA.)";
}
async function perguntar(t) {
  add("u", t); hist.push({ role: "user", content: t }); const m = add("b", "Pensando…");
  try { const r = await fetch(CHAT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mensagens: hist.slice(-8) }) }); if (!r.ok) throw 0; m.textContent = (await r.json()).resposta; }
  catch (e) { m.textContent = local(t); } hist.push({ role: "assistant", content: m.textContent });
}
$("#fab").onclick = () => { const a = $("#chat").hidden; $("#chat").hidden = !a; $("#fab").setAttribute("aria-expanded", a); if (a) { $("#ci").focus(); if (!$("#msgs").children.length) add("b", "Olá! Tire suas dúvidas sobre o ECA Digital. Não dou aconselhamento jurídico."); } };
$("#cf").onsubmit = (e) => { e.preventDefault(); const t = $("#ci").value.trim(); if (t) { $("#ci").value = ""; perguntar(t); } };
$("#chat").onkeydown = (e) => { if (e.key === "Escape") { $("#chat").hidden = true; $("#fab").setAttribute("aria-expanded", "false"); $("#fab").focus(); } };
</script></body></html>
